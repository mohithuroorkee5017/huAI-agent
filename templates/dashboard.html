<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HARIDWAR UNIVERSITY AI - Voice AI Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app-container">
        <!-- Left Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 class="sidebar-title">🎤 HU Voice AI</h1>
                <button class="btn-new-chat" onclick="startNewConversation()" title="New Conversation">
                    <span>➕</span> New Chat
                </button>
            </div>

            <div class="sidebar-content">
                <div class="history-section">
                    <h3 class="history-title">Conversation History</h3>
                    <div id="conversationHistory" class="history-list">
                        <div class="empty-history">No conversations yet</div>
                    </div>
                </div>
            </div>

            <div class="sidebar-footer">
                <div class="user-info-box">
                    <span id="userDisplay" class="user-name">👤 User</span>
                    <button class="btn-logout" onclick="handleLogout()">Logout</button>
                </div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="main-content">
            <!-- Header -->
            <header class="chat-header">
                <div class="header-left">
                    <h1>HUVOICE AGENT</h1>
                    <p class="header-subtitle">Advanced AI Assistant for Haridwar University</p>
                </div>
                <div class="header-right">
                    <span id="statusBadge" class="status-badge">🟢 Online</span>
                </div>
            </header>

            <!-- Chat Messages Container -->
            <div class="chat-container">
                <div id="messagesContainer" class="messages-area">
                    <div class="welcome-banner">
                        <h2>Welcome to HU Voice AI! 👋</h2>
                        <p>Ask me anything about Haridwar University, courses, admissions, or general topics.</p>
                        <div class="quick-prompts">
                            <button class="prompt-btn" onclick="sendQuickPrompt('What are the courses offered by Haridwar University?')">
                                📚 Courses
                            </button>
                            <button class="prompt-btn" onclick="sendQuickPrompt('How do I apply for admission?')">
                                📝 Admission
                            </button>
                            <button class="prompt-btn" onclick="sendQuickPrompt('Tell me about campus facilities')">
                                🏫 Campus
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Typing Indicator -->
                <div id="typingIndicator" class="typing-indicator" style="display: none;">
                    <div class="typing-bubble agent-typing">
                        <span class="dot"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>
                    </div>
                </div>
            </div>

            <!-- Input Area (Bottom) -->
            <div class="input-area">
                <div class="input-toolbar">
                    <button class="toolbar-btn" id="voiceBtn" onclick="toggleVoiceInput()" title="Voice Input (Ctrl+E)">
                        <span>🎤</span>
                    </button>
                    <button class="toolbar-btn" onclick="document.getElementById('imageInput').click()" title="Send Image">
                        <span>🖼️</span>
                    </button>
                    <button class="toolbar-btn" onclick="clearConversation()" title="Clear History (Ctrl+L)">
                        <span>🗑️</span>
                    </button>
                </div>

                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="messageInput" 
                        class="message-input" 
                        placeholder="Ask anything... (Shift+Enter for new line)"
                        onkeypress="handleInputKeyPress(event)"
                    >
                    <button class="btn-send" onclick="sendMessage()" title="Send (Enter)">
                        <span>→</span>
                    </button>
                </div>

                <div id="imagePreview" class="image-preview" style="display: none;">
                    <img id="previewImage" src="" alt="Preview">
                    <button class="btn-remove-image" onclick="removeImagePreview()">✕</button>
                </div>

                <input 
                    type="file" 
                    id="imageInput" 
                    accept="image/jpeg,image/jpg,image/png,image/webp,image/gif,image/bmp"
                    onchange="handleImageSelect(event)"
                    style="display: none;"
                >
            </div>
        </main>

        <!-- Mobile Sidebar Toggle -->
        <button class="mobile-sidebar-toggle" onclick="toggleSidebar()">☰</button>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
