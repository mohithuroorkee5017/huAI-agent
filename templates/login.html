<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HARIDWAR UNIVERSITY AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated background effect */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(0, 255, 136, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 150, 255, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 1;
        }

        .container {
            width: 100%;
            max-width: 450px;
            margin: 20px;
            position: relative;
            z-index: 2;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .login-header {
            background: linear-gradient(135deg, #00ff88 0%, #0096ff 100%);
            padding: 40px 30px;
            text-align: center;
            color: white;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .login-header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .login-header p {
            font-size: 14px;
            opacity: 0.95;
        }

        .login-body {
            padding: 40px;
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: #f0f0f0;
            color: #666;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #00ff88 0%, #0096ff 100%);
            color: white;
            box-shadow: 0 5px 15px rgba(0, 150, 255, 0.3);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #0096ff;
            box-shadow: 0 0 0 3px rgba(0, 150, 255, 0.1);
        }

        .form-group input::placeholder {
            color: #999;
        }

        .password-field {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: #666;
            padding: 5px;
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .remember-forgot label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #666;
            cursor: pointer;
            margin: 0;
            font-weight: 500;
        }

        .remember-forgot input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .remember-forgot a {
            color: #0096ff;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .remember-forgot a:hover {
            color: #00ff88;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00ff88 0%, #0096ff 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 150, 255, 0.3);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 150, 255, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #c33;
            font-size: 14px;
            display: none;
        }

        .success-message {
            background: #efe;
            color: #3c3;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #3c3;
            font-size: 14px;
            display: none;
        }

        .signup-info {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            text-align: center;
            color: #666;
            font-size: 14px;
        }

        .signup-info a {
            color: #0096ff;
            text-decoration: none;
            font-weight: 600;
        }

        .signup-info a:hover {
            color: #00ff88;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .social-login {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .social-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            font-size: 24px;
            transition: all 0.3s ease;
        }

        .social-btn:hover {
            border-color: #0096ff;
            background: #f8fbff;
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
            color: #ccc;
            font-size: 14px;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: #e0e0e0;
            z-index: -1;
        }

        .divider span {
            background: white;
            padding: 0 10px;
        }

        /* ============================================
           RESPONSIVE DESIGN - LOGIN PAGE
           ============================================ */

        /* Mobile: 320px - 480px */
        @media (max-width: 480px) {
            body {
                min-height: 100vh;
                padding: 10px;
            }

            .container {
                max-width: 100%;
                margin: 0;
                padding: 0;
            }

            .login-card {
                border-radius: 15px;
            }

            .login-header {
                padding: 30px 20px;
            }

            .logo {
                font-size: 36px;
                margin-bottom: 10px;
            }

            .login-header h1 {
                font-size: 24px;
                margin-bottom: 3px;
            }

            .login-header p {
                font-size: 13px;
            }

            .login-body {
                padding: 25px;
            }

            .tab-buttons {
                gap: 8px;
                margin-bottom: 25px;
            }

            .tab-btn {
                padding: 10px;
                font-size: 13px;
                border-radius: 8px;
            }

            .form-group {
                margin-bottom: 16px;
            }

            .form-group label {
                font-size: 13px;
                margin-bottom: 6px;
            }

            .form-group input,
            .form-group select {
                padding: 11px 12px;
                font-size: 16px;
                border-radius: 8px;
            }

            .password-toggle {
                font-size: 16px;
            }

            .remember-forgot {
                margin-bottom: 16px;
                font-size: 12px;
            }

            .login-btn {
                padding: 12px;
                font-size: 15px;
            }

            .error-message,
            .success-message {
                padding: 10px;
                margin-bottom: 16px;
                font-size: 13px;
                border-radius: 6px;
            }

            .signup-info {
                margin-top: 16px;
                padding-top: 16px;
                font-size: 13px;
            }

            .social-login {
                gap: 8px;
                margin-bottom: 16px;
            }

            .social-btn {
                padding: 10px;
                font-size: 20px;
            }
        }

        /* Tablets: 481px - 768px */
        @media (min-width: 481px) and (max-width: 768px) {
            .container {
                max-width: 100%;
                margin: 20px;
            }

            .login-card {
                border-radius: 18px;
            }

            .login-header {
                padding: 35px 25px;
            }

            .logo {
                font-size: 42px;
                margin-bottom: 12px;
            }

            .login-header h1 {
                font-size: 26px;
                margin-bottom: 4px;
            }

            .login-header p {
                font-size: 14px;
            }

            .login-body {
                padding: 30px;
            }

            .tab-buttons {
                gap: 10px;
                margin-bottom: 28px;
            }

            .tab-btn {
                padding: 11px;
                font-size: 14px;
            }

            .form-group {
                margin-bottom: 18px;
            }

            .form-group label {
                font-size: 14px;
                margin-bottom: 7px;
            }

            .form-group input,
            .form-group select {
                padding: 12px 14px;
                font-size: 15px;
            }

            .login-btn {
                padding: 13px;
                font-size: 16px;
            }
        }

        /* Small Desktops: 769px - 1024px */
        @media (min-width: 769px) and (max-width: 1024px) {
            .container {
                max-width: 500px;
                margin: 40px auto;
            }

            .login-header {
                padding: 45px 35px;
            }

            .logo {
                font-size: 50px;
                margin-bottom: 15px;
            }

            .login-header h1 {
                font-size: 30px;
            }

            .login-body {
                padding: 40px;
            }
        }

        /* Large Desktops: 1025px+ */
        @media (min-width: 1025px) {
            .container {
                max-width: 500px;
                margin: 60px auto;
            }

            .login-card {
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            }

            .login-header {
                padding: 50px 40px;
            }

            .logo {
                font-size: 56px;
            }

            .login-header h1 {
                font-size: 32px;
            }

            .login-body {
                padding: 45px;
            }
        }

        /* ============================================
           TOUCH DEVICE OPTIMIZATION
           ============================================ */
        @media (hover: none) and (pointer: coarse) {
            .login-btn,
            .tab-btn,
            .social-btn,
            .remember-forgot a,
            .signup-info a {
                min-height: 44px;
                -webkit-tap-highlight-color: transparent;
                tap-highlight-color: transparent;
            }

            .login-btn:active,
            .tab-btn:active {
                opacity: 0.9;
            }

            .form-group input,
            .form-group select {
                font-size: 16px;
                min-height: 44px;
            }

            .password-toggle {
                min-height: 44px;
                min-width: 44px;
            }
        }

        /* ============================================
           LANDSCAPE ORIENTATION
           ============================================ */
        @media (orientation: landscape) and (max-height: 600px) {
            .login-header {
                padding: 20px 30px;
            }

            .logo {
                font-size: 40px;
                margin-bottom: 8px;
            }

            .login-header h1 {
                font-size: 22px;
            }

            .login-body {
                padding: 20px 30px;
            }

            .social-login {
                display: none;
            }

            .divider {
                display: none;
            }

            .signup-info {
                margin-top: 10px;
                padding-top: 10px;
            }
        }

        /* ============================================
           HIGH DPI / RETINA DISPLAYS
           ============================================ */
        @media (min-device-pixel-ratio: 2),
               (min-resolution: 192dpi) {
            .login-card {
                border: 0.5px solid rgba(0, 0, 0, 0.05);
            }

            .form-group input,
            .form-group select {
                border-width: 0.5px;
            }

            .login-btn {
                border-width: 0.5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-card">
            <!-- Header -->
            <div class="login-header">
                <div class="logo">🎤</div>
                <h1>HUVOICE AGENT</h1>
                <p>Voice-Based AI Assistant</p>
            </div>

            <!-- Body -->
            <div class="login-body">
                <!-- Tab Buttons -->
                <div class="tab-buttons">
                    <button class="tab-btn active" onclick="switchTab('login')">Login</button>
                    <button class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
                </div>

                <!-- Login Form -->
                <div id="login-form" class="form-section active">
                    <div class="error-message" id="login-error"></div>
                    <div class="success-message" id="login-success"></div>

                    <form onsubmit="handleLogin(event)">
                        <div class="form-group">
                            <label for="login-email">Email Address</label>
                            <input 
                                type="email" 
                                id="login-email" 
                                name="email" 
                                placeholder="you@example.com"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="login-password">Password</label>
                            <div class="password-field">
                                <input 
                                    type="password" 
                                    id="login-password" 
                                    name="password" 
                                    placeholder="••••••••"
                                    required
                                >
                                <button type="button" class="password-toggle" onclick="togglePassword('login-password')">👁️</button>
                            </div>
                        </div>

                        <div class="remember-forgot">
                            <label>
                                <input type="checkbox" name="remember">
                                Remember me
                            </label>
                            <a href="#">Forgot password?</a>
                        </div>

                        <button type="submit" class="login-btn" id="login-submit">Login</button>
                    </form>
                </div>

                <!-- Sign Up Form -->
                <div id="signup-form" class="form-section">
                    <div class="error-message" id="signup-error"></div>
                    <div class="success-message" id="signup-success"></div>

                    <form onsubmit="handleSignup(event)">
                        <div class="form-group">
                            <label for="signup-name">Full Name</label>
                            <input 
                                type="text" 
                                id="signup-name" 
                                name="fullname" 
                                placeholder="John Doe"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="signup-email">Email Address</label>
                            <input 
                                type="email" 
                                id="signup-email" 
                                name="email" 
                                placeholder="you@example.com"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="signup-password">Password</label>
                            <div class="password-field">
                                <input 
                                    type="password" 
                                    id="signup-password" 
                                    name="password" 
                                    placeholder="••••••••"
                                    required
                                >
                                <button type="button" class="password-toggle" onclick="togglePassword('signup-password')">👁️</button>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="signup-confirm">Confirm Password</label>
                            <div class="password-field">
                                <input 
                                    type="password" 
                                    id="signup-confirm" 
                                    name="confirm_password" 
                                    placeholder="••••••••"
                                    required
                                >
                                <button type="button" class="password-toggle" onclick="togglePassword('signup-confirm')">👁️</button>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>
                                <input type="checkbox" name="agree" required>
                                <span style="display: inline; margin-left: 6px;">I agree to the Terms & Conditions</span>
                            </label>
                        </div>

                        <button type="submit" class="login-btn" id="signup-submit">Create Account</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Switch between login and signup
        function switchTab(tab) {
            document.getElementById('login-form').classList.remove('active');
            document.getElementById('signup-form').classList.remove('active');
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

            if (tab === 'login') {
                document.getElementById('login-form').classList.add('active');
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
            } else {
                document.getElementById('signup-form').classList.add('active');
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
            }
        }

        // Toggle password visibility
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        // Handle login
        // Handle login
        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('login-submit');

            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> Logging in...';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Save user data to localStorage
                    localStorage.setItem('user', JSON.stringify({ email, fullname: email.split('@')[0] }));
                    document.getElementById('login-success').textContent = 'Login successful! Redirecting...';
                    document.getElementById('login-success').style.display = 'block';
                    setTimeout(() => window.location.href = '/dashboard', 1500);
                } else {
                    throw new Error(data.error || 'Login failed');
                }
            } catch (error) {
                document.getElementById('login-error').textContent = error.message;
                document.getElementById('login-error').style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Login';
            }
        }

        // Handle signup
        async function handleSignup(event) {
            event.preventDefault();
            const fullname = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            const confirm = document.getElementById('signup-confirm').value;

            if (password !== confirm) {
                document.getElementById('signup-error').textContent = 'Passwords do not match!';
                document.getElementById('signup-error').style.display = 'block';
                return;
            }

            const btn = document.getElementById('signup-submit');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> Creating account...';

            try {
                const response = await fetch('/api/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullname, email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Save user data to localStorage
                    localStorage.setItem('user', JSON.stringify({ email, fullname }));
                    document.getElementById('signup-success').textContent = 'Account created! Logging in...';
                    document.getElementById('signup-success').style.display = 'block';
                    setTimeout(() => window.location.href = '/dashboard', 1500);
                } else {
                    throw new Error(data.error || 'Signup failed');
                }
            } catch (error) {
                document.getElementById('signup-error').textContent = error.message;
                document.getElementById('signup-error').style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Create Account';
            }
        }
    </script>
</body>
</html>
