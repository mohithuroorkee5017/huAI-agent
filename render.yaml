services:
  - type: web
    name: huvoice-ai-app
    runtime: python
    pythonVersion: 3.11

    buildCommand: cd api && pip install -r requirements.txt

    startCommand: cd api && uvicorn main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      
      - key: CORS_ORIGINS
        value: "*"
      
      - key: DEBUG
        value: "false"